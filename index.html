<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

    <header>
        <h1 class="logo">Instagram</h1>
        <div class="header-icons">
            <a href="#"><img src="New  post 1.png" alt="Add"></a>
            <a href="#"><img src="favorite.svg" alt="Likes"></a>
        </div>
    </header>

    <section class="stories">
        <div class="story">
            <div class="story-gradient-ring">
                <img src="WhatsApp Image 2025-08-11 at 8.14.25 PM.jpeg" alt="Your Story">
            </div>
            <p>Your story</p>
        </div>
        <div class="story">
            <div class="story-gradient-ring">
                <img src="messi.webp" alt="Leo Messi's Story">
            </div>
            <p>leo.messi</p>
        </div>
         <div class="story">
            <div class="story-gradient-ring">
                <img src="vijay.jpeg" alt="Vijay Story">
            </div>
            <p>Vijay</p>
        </div>
         <div class="story">
            <div class="story-gradient-ring">
                <img src="ronaldo.jpg" alt="Ronaldo's Story">
            </div>
            <p>Ronaldo</p>
        </div>
        </section>

    <article class="post">
        <div class="post-header">
            <div class="poster-info">
                <img class="profile-pic-small" src="Marvel.jpg" alt="Marvel's Profile Picture">
                <p class="username">marvel</p>
            </div>
            <img class="more-options-icon" src="More icon.png" alt="More options">
        </div>

        <img class="post-image" src="spiderman.jpeg" alt="Spider-Man post">

        <div class="action-buttons">
            <div class="left-icons">
                <img src="like icon.png" alt="Like">
                <img src="comment icon.png" alt="Comment">
                <img src="Repost icon.png" alt="Repost">
                <img src="Share icon.png" alt="Share">
            </div>
            <div class="right-icon">
                <img src="SAVE ICON.png" alt="Bookmark">
            </div>
        </div>

        <div class="post-details">
            <p class="likes">Liked by <strong>jai_bharath_10</strong> and <strong>905,235 others</strong></p>
            <p class="caption"><strong>marvel</strong> Start your countdown to the glorious arrival of Marvel Studios' #spiderman... <span class="more-text">more</span></p>
            <p class="view-comments">View all 10 comments</p>
        </div>
    </article>

    <nav class="bottom-nav">
        <a href="#"><img src="Vector.svg" alt="Home"></a>
        <a href="#"><img src="Reels icon.png" alt="Search"></a>
        <a href="#"><img src="Message icon.png" alt="Reels"></a>
        <a href="#"><img src="search icon.png" alt="Shop"></a>
        <a href="#"><img class="profile-pic-nav" src="WhatsApp Image 2025-08-11 at 8.14.25 PM.jpeg" alt="Profile"></a>
    </nav>

</body>
</html>
